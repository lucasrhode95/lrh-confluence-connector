[project]
name = "lrh-confluence-connector-poc"
version = "0.1.0"
description = "Read-only MCP proof of concept for Confluence Data Center."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=1.26,<2",
]

[project.scripts]
confluence-connector = "confluence_connector.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/confluence_connector"]