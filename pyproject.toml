[project]
name = "lrh-confluence-connector"
version = "0.1.0"
description = "Local MCP connector for Confluence Data Center."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=1.26,<2",
    "msal-extensions>=1.3.1,<2",
    "pydantic>=2.11,<3",
    "tzdata>=2024.1",
]

[project.scripts]
confluence-connector = "confluence_connector.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/confluence_connector"]
