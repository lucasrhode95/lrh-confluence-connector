<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Confluence connector overview</title>
  <desc id="desc">A local command-line authentication flow stores one verified Confluence token in encrypted per-user storage. A stdio MCP process uses it for search, navigation, metadata, page-text, selected attachment downloads, batch page exports, and page, draft and structure writes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f8fb"/><stop offset="1" stop-color="#edf3f7"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11" fill="none" stroke="#60758a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .title{font:700 36px system-ui,sans-serif;fill:#142536}.sub{font:400 18px system-ui,sans-serif;fill:#52677b}
      .head{font:700 20px system-ui,sans-serif;fill:#142536}.body{font:400 16px system-ui,sans-serif;fill:#52677b}
      .small{font:600 14px system-ui,sans-serif;fill:#31506b}.card{fill:#fff;stroke:#cbd8e2;stroke-width:1.5}
      .blue{fill:#eaf4fc;stroke:#8cb9dc}.green{fill:#eef7f3;stroke:#a3cbb7}.gold{fill:#fff6e8;stroke:#ddc18e}
    </style>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <text x="64" y="84" class="title">Confluence connector</text>
  <text x="64" y="118" class="sub">A local, single-account bridge between an MCP client and Confluence Data Center</text>

  <rect x="64" y="190" width="260" height="170" rx="18" class="card gold"/>
  <text x="92" y="232" class="head">CLI sign-in</text>
  <text x="92" y="268" class="body"><tspan x="92">Hidden PAT prompt</tspan><tspan x="92" dy="27">Current-user verification</tspan><tspan x="92" dy="27">Explicit local sign-out</tspan></text>

  <rect x="64" y="432" width="260" height="170" rx="18" class="card green"/>
  <text x="92" y="475" class="head">Encrypted storage</text>
  <text x="92" y="511" class="body"><tspan x="92">Token and account name</tspan><tspan x="92" dy="27">Cross-process lock</tspan><tspan x="92" dy="27">No plaintext fallback</tspan></text>

  <rect x="450" y="190" width="370" height="460" rx="22" class="card blue"/>
  <text x="486" y="235" class="head">One MCP process</text>
  <text x="486" y="269" class="body"><tspan x="486">Lazy application context</tspan><tspan x="486" dy="28">One async HTTP/1.1 client</tspan><tspan x="486" dy="28">Token read for every request</tspan></text>
  <rect x="486" y="373" width="298" height="82" rx="14" fill="#fff" stroke="#b9d4e8"/>
  <text x="510" y="405" class="head" font-size="18">Page reads and exports</text>
  <text x="510" y="432" class="body" font-size="14">Text, rich, attachments and ZIP files</text>
  <rect x="486" y="473" width="298" height="148" rx="14" fill="#fff" stroke="#b9d4e8"/>
  <text x="510" y="505" class="head" font-size="18">Page, draft and structure writes</text>
  <text x="510" y="532" class="body" font-size="14"><tspan x="510">Create · update · publish drafts · labels</tspan><tspan x="510" dy="24">Move · trash · restore with placement</tspan></text>

  <rect x="956" y="272" width="260" height="236" rx="18" class="card"/>
  <text x="992" y="320" class="head">Confluence</text>
  <text x="992" y="356" class="body"><tspan x="992">Configured deployment</tspan><tspan x="992" dy="29">Current-user endpoint</tspan><tspan x="992" dy="29">Read and write REST endpoints</tspan></text>
  <text x="992" y="462" class="small">No browser-cookie reuse</text>

  <path d="M194 360v56" fill="none" stroke="#60758a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M324 275h72q28 0 28 28v50" fill="none" stroke="#60758a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M324 517h74q26 0 26-28V412" fill="none" stroke="#60758a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M820 396h112q24 0 24-24" fill="none" stroke="#60758a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M820 510h106q30 0 30-28" fill="none" stroke="#60758a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="850" y="365" class="small">HTTPS REST</text>

  <text x="64" y="686" class="small">Search, reads, downloads, exports and page/draft/structure writes are implemented. Live write acceptance remains manual.</text>
</svg>
