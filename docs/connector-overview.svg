    <linearGradient id="connector" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16385f"/><stop offset="1" stop-color="#245c78"/></linearGradient>
    <linearGradient id="cf-lower" x1="59.68" y1="67.65" x2="20.35" y2="45.05" gradientUnits="userSpaceOnUse"><stop offset="0.18" stop-color="#0052cc"/><stop offset="1" stop-color="#2684ff"/></linearGradient>
    <linearGradient id="cf-upper" x1="3.07" y1="-0.37" x2="42.41" y2="22.24" gradientUnits="userSpaceOnUse"><stop offset="0.18" stop-color="#0052cc"/><stop offset="1" stop-color="#2684ff"/></linearGradient>
