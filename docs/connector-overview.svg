<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="580" viewBox="0 0 1500 580" role="img" aria-labelledby="title description">
  <title id="title">Confluence for MCP clients</title>
  <desc id="description">Local agentic MCP clients connect over stdio to a Confluence Connector running on this computer. It works with one user's Confluence Data Center account through the documented Confluence REST API, plus Confluence's private page-move action for sibling positions and cross-space moves. It searches and reads pages, downloads attachments, exports pages, and creates, edits, moves, trashes and restores pages when a write tool is called. ChatGPT web can reach the same local server through OpenAI's Secure MCP Tunnel.</desc>
