<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1700" role="img" aria-labelledby="title desc">
  <title id="title">Confluence connector code map</title>
  <desc id="desc">A package and class map of the CLI, nineteen MCP tools, services, remote adapters, encrypted token store, utilities, and typed domain models. Arrows show the primary call paths.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11" fill="none" stroke="#60758a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .title{font:700 32px system-ui,sans-serif;fill:#15283a}.section{font:700 19px system-ui,sans-serif;fill:#15283a}
      .head{font:700 16px system-ui,sans-serif;fill:#15283a}.body{font:400 13px system-ui,sans-serif;fill:#52677b}
      .small{font:600 12px system-ui,sans-serif;fill:#35536e}.box{fill:#fff;stroke:#c7d4df;stroke-width:1.4}
      .entry{fill:#edf5fc;stroke:#8db8d8}.core{fill:#f6f3fb;stroke:#b8a9d1}.remote{fill:#eff7f3;stroke:#a8cbbb}
      .secure{fill:#fff6e9;stroke:#d9bd87}.domain{fill:#f1f4f7;stroke:#bac7d2}.line{fill:none;stroke:#60758a;stroke-width:1.8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1480" height="1700" rx="26" fill="#f6f8fb"/>
  <text x="48" y="58" class="title">Package and call map</text>
  <text x="48" y="88" class="body">Foundation, read, export, attachment-download, page/draft-write and structure modules currently implemented.</text>

  <text x="48" y="144" class="section">Entry points and composition</text>
  <rect x="48" y="165" width="255" height="140" rx="15" class="box entry"/>
  <text x="70" y="198" class="head">__main__.py</text>
  <text x="70" y="225" class="body"><tspan x="70">main · build_parser</tspan><tspan x="70" dy="20">_auth · _status</tspan></text>
  <rect x="375" y="165" width="280" height="140" rx="15" class="box core"/>
  <text x="397" y="198" class="head">bootstrap.py</text>
  <text x="397" y="225" class="body"><tspan x="397">AppContext · Services</tspan><tspan x="397" dy="20">lazy service composition</tspan></text>
  <rect x="48" y="345" width="255" height="170" rx="15" class="box entry"/>
  <text x="70" y="378" class="head">surfaces/mcp_main.py</text>
  <text x="70" y="405" class="body"><tspan x="70">build_server · serve_mcp</tspan><tspan x="70" dy="20">auth · spaces · search · users</tspan><tspan x="70" dy="20">tree · metadata · get_pages</tspan><tspan x="70" dy="20">downloads · exports · page/draft writes</tspan><tspan x="70" dy="20">structure · labels · logs</tspan></text>
  <rect x="375" y="345" width="280" height="170" rx="15" class="box remote"/>
  <text x="397" y="378" class="head">service/</text>
  <text x="397" y="405" class="body"><tspan x="397">spaces · search · users · tree · metadata</tspan><tspan x="397" dy="22">pages · text · attachments · exports</tspan><tspan x="397" dy="22">writes · structure · markup · local files</tspan></text>

  <text x="710" y="144" class="section">Remote adapters</text>
  <rect x="710" y="165" width="300" height="150" rx="15" class="box remote"/>
  <text x="732" y="198" class="head">remote/confluence.py</text>
  <text x="732" y="225" class="body"><tspan x="732">ConfluenceApi</tspan><tspan x="732" dy="20">current_user · spaces · search · users</tspan><tspan x="732" dy="20">children · history · drafts · page writes</tspan><tspan x="732" dy="20">trash · restore · properties · permissions</tspan><tspan x="732" dy="20">attachments · comments · labels · move tasks</tspan></text>
  <rect x="1050" y="165" width="370" height="180" rx="15" class="box remote"/>
  <text x="1072" y="198" class="head">remote/transport.py</text>
  <text x="1072" y="225" class="body"><tspan x="1072">ConfluenceTransport</tspan><tspan x="1072" dy="20">get_json · download_to · send_json</tspan><tspan x="1072" dy="20">retry/status mapping · account checks</tspan><tspan x="1072" dy="20">MAX_ATTEMPTS · MAX_JSON_BYTES</tspan></text>
  <rect x="710" y="360" width="300" height="150" rx="15" class="box remote"/>
  <text x="732" y="393" class="head">remote/links.py</text>
  <text x="732" y="420" class="body"><tspan x="732">PageLinkResolver</tspan><tspan x="732" dy="20">ID and URL validation</tspan><tspan x="732" dy="20">short links · legacy display URLs</tspan></text>
  <rect x="1050" y="385" width="370" height="125" rx="15" class="box domain"/>
  <text x="1072" y="418" class="head">remote/ports.py</text>
  <text x="1072" y="445" class="body"><tspan x="1072">CredentialSource protocol</tspan><tspan x="1072" dy="20">TokenStore is the current provider</tspan></text>

  <text x="48" y="560" class="section">Authentication, models and utilities</text>
  <rect x="48" y="580" width="300" height="170" rx="15" class="box secure"/>
  <text x="70" y="613" class="head">auth/store.py</text>
  <text x="70" y="640" class="body"><tspan x="70">TokenStore</tspan><tspan x="70" dy="20">StoredCredential</tspan><tspan x="70" dy="20">encrypted persistence</tspan><tspan x="70" dy="20">CrossPlatLock</tspan></text>
  <rect x="390" y="580" width="430" height="210" rx="15" class="box domain"/>
  <text x="412" y="613" class="head">domain/</text>
  <text x="412" y="640" class="body"><tspan x="412">models.py: auth/space/search/user, page/draft/structure results,</tspan><tspan x="412" dy="20">text, attachment, comment, label and reference models</tspan><tspan x="412" dy="26">errors.py: ConnectorError, AuthenticationRequired, AccountMismatch,</tspan><tspan x="412" dy="20">SecureStorageUnavailable, InvalidRequest, NotFound, Throttled,</tspan><tspan x="412" dy="20">Upstream, PermissionDenied, Conflict, UncertainWrite</tspan></text>
  <rect x="865" y="580" width="260" height="170" rx="15" class="box domain"/>
  <text x="887" y="613" class="head">config.py</text>
  <text x="887" y="640" class="body"><tspan x="887">load_config · add_config_argument</tspan><tspan x="887" dy="20">data_dir · product constants</tspan></text>
  <rect x="1170" y="580" width="250" height="170" rx="15" class="box domain"/>
  <text x="1192" y="613" class="head">logs.py</text>
  <text x="1192" y="640" class="body"><tspan x="1192">configure_app_logging</tspan><tspan x="1192" dy="20">SecretRedactionFilter</tspan></text>

  <text x="48" y="845" class="section">Primary call paths</text>
  <rect x="48" y="867" width="1372" height="128" rx="16" fill="#fff" stroke="#c7d4df" stroke-width="1.4"/>
  <text x="78" y="907" class="body"><tspan class="small">MCP:</tspan><tspan> mcp_main → AppContext → account-bound read/write services → ConfluenceApi → ConfluenceTransport → Confluence DC</tspan></text>
  <text x="78" y="943" class="body"><tspan class="small">Credential:</tspan><tspan> CLI / AppContext → TokenStore → encrypted persistence; transport reloads and checks the active username</tspan></text>
  <text x="78" y="979" class="body"><tspan class="small">Page URLs:</tspan><tspan> PageLinkResolver → ConfluenceApi for display-title lookup, or ConfluenceTransport for short-link redirects</tspan></text>

  <text x="48" y="1038" class="section">Package and class inventory</text>
  <rect x="48" y="1060" width="445" height="590" rx="16" class="box remote"/>
  <text x="70" y="1094" class="head">service/</text>
  <text x="70" y="1124" class="body" font-size="12">
    <tspan x="70">service/spaces.py · SpaceService</tspan>
    <tspan x="70" dy="23">service/search.py · ContentSearch</tspan>
    <tspan x="70" dy="23">service/users.py · UserSearch</tspan>
    <tspan x="70" dy="23">service/tree.py · PageTree, _TreeState</tspan>
    <tspan x="70" dy="23">service/metadata.py · PageMetadataService</tspan>
    <tspan x="70" dy="23">service/pages.py · PageTextService, _PageRequest,</tspan>
    <tspan x="88" dy="19">_LoadedPage, _CursorState</tspan>
    <tspan x="70" dy="23">service/page_text.py · PageTextBlock, RenderedPageBody,</tspan>
    <tspan x="88" dy="19">_Macro, _ConfluenceMarkdown</tspan>
    <tspan x="70" dy="23">service/attachments.py · AttachmentDownloads</tspan>
    <tspan x="70" dy="23">service/exports.py · PageExports, _ReportItem,</tspan>
    <tspan x="88" dy="19">_PageMetadata, _PageExport</tspan>
    <tspan x="70" dy="23">service/writes.py · PageWrites, _Placement</tspan>
    <tspan x="70" dy="23">service/structure.py · PageStructure, _PageNode</tspan>
    <tspan x="70" dy="23">service/write_markup.py · _MarkupNode, _MarkupParser,</tspan>
    <tspan x="88" dy="19">_TextCollector, _SafetyParser</tspan>
    <tspan x="70" dy="23">service/timezone_calibration.py · CqlTimezoneCalibration</tspan>
    <tspan x="70" dy="23">service/cql_dates.py · date and timezone conversion</tspan>
    <tspan x="70" dy="23">service/cursors.py · cursor encoding and decoding</tspan>
    <tspan x="70" dy="23">service/localfiles.py · private output and cleanup</tspan>
  </text>

  <rect x="515" y="1060" width="500" height="590" rx="16" class="box domain"/>
  <text x="537" y="1094" class="head">domain/models.py</text>
  <text x="537" y="1124" class="body" font-size="11.5">
    <tspan x="537">CurrentUser</tspan><tspan x="537" dy="19">AuthStatus</tspan>
    <tspan x="537" dy="19">SpaceSummary</tspan><tspan x="537" dy="19">SpaceList</tspan>
    <tspan x="537" dy="19">SearchScope</tspan><tspan x="537" dy="19">SearchQuery</tspan>
    <tspan x="537" dy="19">PageSummary</tspan><tspan x="537" dy="19">ContentSearchHit</tspan>
    <tspan x="537" dy="19">RemoteContentSearchPage</tspan><tspan x="537" dy="19">ContentSearchResult</tspan>
    <tspan x="537" dy="19">PersonSummary</tspan><tspan x="537" dy="19">RemoteUserSearchPage</tspan>
    <tspan x="537" dy="19">UserSearchResult</tspan><tspan x="537" dy="19">PageTreeNode</tspan>
    <tspan x="537" dy="19">PageTreeResult</tspan><tspan x="537" dy="19">PageVersion</tspan>
    <tspan x="537" dy="19">PageMetadata</tspan><tspan x="537" dy="19">PageMetadataFailure</tspan>
    <tspan x="537" dy="19">PageMetadataResult</tspan><tspan x="537" dy="19">ResolvedPageReference</tspan>
    <tspan x="537" dy="19">PageParseScope</tspan><tspan x="537" dy="19">PageReference</tspan>
    <tspan x="537" dy="19">PageAttachment</tspan><tspan x="537" dy="19">SavedAttachment</tspan>
  </text>
  <text x="785" y="1124" class="body" font-size="11.5">
    <tspan x="785">AttachmentDownloadFailure</tspan><tspan x="785" dy="19">AttachmentDownloadResult</tspan>
    <tspan x="785" dy="19">PageExportResult</tspan><tspan x="785" dy="19">PageWriteResult</tspan>
    <tspan x="785" dy="19">PagePlacement</tspan><tspan x="785" dy="19">PageMoveResult</tspan>
    <tspan x="785" dy="19">PageStructureOutcome</tspan><tspan x="785" dy="19">PageDeleteResult</tspan>
    <tspan x="785" dy="19">TrashPageSummary</tspan><tspan x="785" dy="19">TrashListResult</tspan>
    <tspan x="785" dy="19">PageRestoreResult</tspan><tspan x="785" dy="19">DraftSummary</tspan>
    <tspan x="785" dy="19">DraftListResult</tspan><tspan x="785" dy="19">DraftDeletionResult</tspan>
    <tspan x="785" dy="19">RemoteDraftPage</tspan><tspan x="785" dy="19">RemoteTrashPage</tspan>
    <tspan x="785" dy="19">LabelChangeFailure</tspan><tspan x="785" dy="19">LabelChangeResult</tspan>
    <tspan x="785" dy="19">PageComment</tspan><tspan x="785" dy="19">RemotePageComment</tspan>
    <tspan x="785" dy="19">RemotePageContent</tspan><tspan x="785" dy="19">PageReadRecord</tspan>
    <tspan x="785" dy="19">PageReadFailure</tspan><tspan x="785" dy="19">PageReadResult</tspan>
  </text>

  <rect x="1037" y="1060" width="395" height="590" rx="16" class="box secure"/>
  <text x="1059" y="1094" class="head">Foundation and remote</text>
  <text x="1059" y="1124" class="body" font-size="11.5">
    <tspan x="1059">bootstrap.py · Services, AppContext</tspan>
    <tspan x="1059" dy="21">auth/store.py · StoredCredential, TokenStore</tspan>
    <tspan x="1059" dy="21">logs.py · SecretRedactionFilter</tspan>
    <tspan x="1059" dy="21">remote/ports.py · CredentialSource</tspan>
    <tspan x="1059" dy="21">remote/transport.py · ConfluenceTransport</tspan>
    <tspan x="1059" dy="21">remote/confluence.py · _LongTaskFailure,</tspan>
    <tspan x="1077" dy="18">ConfluenceApi</tspan>
    <tspan x="1059" dy="21">remote/links.py · PageLinkResolver</tspan>
    <tspan x="1059" dy="21">domain/errors.py</tspan>
    <tspan x="1059" dy="19">ConnectorError · AuthenticationRequired</tspan>
    <tspan x="1059" dy="19">AccountMismatch · SecureStorageUnavailable</tspan>
    <tspan x="1059" dy="19">InvalidRequest · NotFound · Throttled</tspan>
    <tspan x="1059" dy="19">Upstream · PermissionDenied · Conflict</tspan>
    <tspan x="1059" dy="19">UncertainWrite</tspan>
    <tspan x="1059" dy="25">Function modules</tspan>
    <tspan x="1059" dy="19">__main__.py · CLI entry and calibration reporting</tspan>
    <tspan x="1059" dy="19">config.py · load, validate, atomic update</tspan>
    <tspan x="1059" dy="19">timezones.py · parse and format offsets</tspan>
    <tspan x="1059" dy="19">surfaces/mcp_main.py · 19 thin tool declarations</tspan>
    <tspan x="1059" dy="19">Packages: confluence_connector · auth · domain</tspan>
    <tspan x="1059" dy="19">remote · service · surfaces (each has __init__.py)</tspan>
  </text>

  <path d="M303 235h55" class="line"/><path d="M303 420h55" class="line"/>
  <path d="M655 420h45v-170h5" class="line"/><path d="M1010 240h30" class="line"/>
